<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F4F5F8" id="theme-color-meta">
  <meta name="description" content="Cloud Mail 是一个 Serverless 响应式邮箱服务，支持邮件发送，可部署到 Cloudflare 平台，降低服务器成本。Cloud Mail is a serverless responsive email service that supports email sending and can be deployed on Cloudflare to reduce server costs.">
  <title>Cloud Mail</title>
  <link rel="icon" href="/mail.png" type="image/png">
  <script>
    const uiStoreStr = localStorage.getItem('ui')
    let isDark = false
    if (uiStoreStr) {
      try {
        const uiStore = JSON.parse(uiStoreStr)
        isDark = !!uiStore.dark
        const root = document.documentElement
        root.setAttribute('class', isDark ? 'dark' : '')
      } catch (e) {}
    }
    const metaTag = document.getElementById('theme-color-meta');
    metaTag?.setAttribute('content', isDark ? '#0B0D12' : '#F4F5F8');
  </script>
</head>
<style>
  html {
    background: #F4F5F8;
  }
  html.dark {
    background: #0B0D12;
  }
  #loading-first {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: #F4F5F8;
  }
  html.dark #loading-first {
    background: #0B0D12;
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .loading-logo-wrap {
    width: 68px;
    height: 68px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border: 1px solid rgba(15, 23, 42, 0.08);
    box-shadow: 0 10px 30px -8px rgba(15, 23, 42, 0.12);
  }
  html.dark .loading-logo-wrap {
    background: #171B24;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.5);
  }

  .loading-image {
    width: 44px;
    height: 44px;
    object-fit: contain;
  }

  .loading-progress {
    position: relative;
    width: 72px;
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(37, 99, 235, 0.14);
  }
  html.dark .loading-progress {
    background: rgba(59, 130, 246, 0.18);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #2563EB, #60A5FA);
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% {
      transform: scaleX(0);
    }
    100% {
      transform: scaleX(1);
    }
  }
</style>
<body>
<div id="loading-first">
  <div class="loading-icon">
    <div class="loading-logo-wrap">
      <img class="loading-image" src="/mail-pwa.png" alt="Cloud Mail">
    </div>
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
